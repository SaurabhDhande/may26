trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: myapp
  tag: $(Build.BuildId)

stages:
  - stage: BuildAndPush
    displayName: Build and Push Docker Image

    jobs:
      - job: DockerBuildPush
        displayName: Docker Build and Push

        steps:

          - checkout: self

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: Dockethub

          - task: Docker@2
            displayName: Build and Push Image
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: Dockerfile
              containerRegistry: Dockethub
              tags: |
                $(tag)
                latest
