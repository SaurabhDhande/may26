trigger:
  - master

pool:
  vmImage: ubuntu-latest

variables:
  imageName: myapp
  tag: $(Build.BuildId)

stages:
  - stage: BuildAndPush
    displayName: Build and Push Docker Image

    jobs:
      - job: DockerBuildPush
        displayName: Docker Build and Push

        steps:

          - checkout: self

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: Dockethub

          - task: Docker@2
            displayName: Build and Push Image
            inputs:
              command: buildAndPush
              containerRegistry: Dockethub
              repository: $(imageName)
              dockerfile: $(Build.SourcesDirectory)/service-a/Dockerfile
              buildContext: $(Build.SourcesDirectory)/service-a
              tags: |
                $(tag)
                latest